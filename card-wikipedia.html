<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap');

        * {
            margin: 0;
            padding: 0;
            font-family: "Work Sans", sans-serif;
        }

        section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: white;

        }

        .container {
            margin: auto;
            width: 100%;
            max-width: 1170px;
        }

        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;

        }

        .card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 1px 10px 0px #0000001A;
            position: relative;
            overflow: hidden;
            height: 350px;
        }

        h2 {
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 24px;
            margin-bottom: 12px;
            font-weight: 500;
            color: #000000;

        }

        h3 {
            color: #7B7B7B;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: 400;
        }

        .icon-box {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 5px;
            position: absolute;
            top: 37.5px;
            right: -50px;
            transition: all 300ms;
        }

        .icon {
            height: 40px;
            width: 40px;
            display: flex;
            align-items: center;
            background-color: white;
            justify-content: center;
        }

        .card:hover .icon-box {
            right: 0;
        }

        @media (max-width: 1024px) {
            .row {
                flex-wrap: wrap;
            }
        }
    </style>

</head>
