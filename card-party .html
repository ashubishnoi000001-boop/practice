<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1322px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
        }

        .row {
            display: flex;
            gap: 24px;
            align-items: center;
            justify-content: center;

        }

        .card {
            padding: 35px 37px 30px 43px;
            border: 1px solid #00000033;
            border-radius: 30px;
            flex-direction: column;
            transition: all 300ms;
        }

        .card:hover {
            border-color: transparent;
            box-shadow: 0px 8px 35px 0px #0000001A;
        }

        img {
            border-radius: 12px;
            gap: 21px;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            line-height: 150%;
            text-align: center;
            margin-bottom: 33px;
            color: #000000;
        }

        h2 {
            line-height: 150%;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            flex-direction: column;
            margin-top: 21px;
            margin-bottom: 12px;
        }

        button {
            padding: 11px 28px;
            background: #2C49FE;
            color: white;
            font-weight: 600;
            font-size: 16px;
            border-radius: 23px;
            margin-top: 32px;
            border: none;
            cursor: pointer;
          
        }

        p {
            color: #666666;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        @media (max-width: 1280px) {
            .row{
                flex-wrap: wrap;
            }
            
        }

        @media (max-width: 576px) {
            img{
                width: 100%;
            }
            .card{
                padding: 0%;
            }

            h1{
                font-size: 31px;
            }
        }
    </style>
</head>
